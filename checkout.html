<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Zany'sCollection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald:#0B3D2E; --emerald-deep:#082B20; --emerald-light:#1D5C46;
    --magenta:#C2185B; --magenta-deep:#9A1149;
    --gold:#D4AF37; --gold-deep:#B8912A;
    --cream:#FBF6EA; --ink:#20180F; --ink-soft:#5c5548; --line:#EAE0C8;
    --display:'Playfair Display', serif; --body:'Poppins', sans-serif; --max:1280px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:var(--body); color:var(--ink); background:var(--cream); -webkit-font-smoothing:antialiased; }
  img,svg{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer; border:none; background:none;}
  :focus-visible{ outline:2px solid var(--magenta); outline-offset:3px; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 40px; }
  .eyebrow{ font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-deep); font-weight:700; }
  h1,h2{ font-family:var(--display); font-weight:700; line-height:1.1; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:16px 30px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; border-radius:40px; transition:all .3s ease; width:100%; }
  .btn-dark{ background:var(--emerald); color:#fff; }
  .btn-dark:hover{ background:var(--magenta); }
  .btn-whatsapp{ background:#25D366; color:#fff; }
  .btn-whatsapp:hover{ background:#1eb857; }
  .btn-whatsapp svg{ width:18px; height:18px; fill:#fff; }

  header{ position:sticky; top:0; z-index:100; background:rgba(251,246,234,.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; height:88px; }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-text{
    font-family:var(--display); font-size:19px; font-weight:800;
    text-transform:uppercase; letter-spacing:.1em;
    background:linear-gradient(100deg, #9B5F5F 15%, #F3D9C4 42%, #C9967C 58%, #9B5F5F 85%);
    background-size:280% 100%; background-position:20% 0;
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo-text span{ -webkit-background-clip:text; background-clip:text; color:transparent; }
  .icons-row{ display:flex; align-items:center; gap:22px; }
  .cart-dot{ position:relative; }
  .cart-dot::after{ content:attr(data-count); position:absolute; top:-7px; right:-8px; background:var(--magenta); color:#fff; font-size:9px; width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .cart-dot:not([data-count])::after, .cart-dot[data-count="0"]::after{ display:none; }
  .icons-row svg{ width:19px; height:19px; stroke:var(--emerald); }

  .page-head{ padding:36px 0 20px; }
  .breadcrumb{ font-size:12px; color:var(--ink-soft); display:flex; gap:8px; align-items:center; }
  .page-head h1{ font-size:clamp(28px,3.4vw,38px); margin-top:10px; }

  .checkout-layout{ display:grid; grid-template-columns:1fr 380px; gap:50px; padding:16px 0 90px; align-items:start; }

  .form-card{ background:#fff; border-radius:16px; padding:30px; box-shadow:0 4px 18px -10px rgba(32,24,15,.12); }
  .form-card h3{ font-family:var(--display); font-size:18px; margin-bottom:20px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:var(--ink-soft); }
  .field input, .field textarea{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:var(--cream); outline:none; transition:border-color .2s; }
  .field input:focus, .field textarea:focus{ border-color:var(--magenta); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field.error input, .field.error textarea{ border-color:var(--magenta); }
  .field-error-msg{ font-size:11px; color:var(--magenta-deep); margin-top:4px; display:none; }
  .field.error .field-error-msg{ display:block; }

  .summary-card{ background:#fff; border-radius:16px; padding:28px; box-shadow:0 4px 18px -10px rgba(32,24,15,.12); position:sticky; top:110px; }
  .summary-card h3{ font-family:var(--display); font-size:19px; margin-bottom:18px; }
  .summary-item{ display:flex; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:10px; color:var(--ink-soft); }
  .summary-item span:first-child{ color:var(--ink); }
  .summary-row.total{ display:flex; justify-content:space-between; font-size:16px; font-weight:700; color:var(--ink); border-top:1px solid var(--line); padding-top:16px; margin-top:12px; }
  .summary-note{ display:flex; gap:10px; align-items:flex-start; background:var(--cream); border-radius:10px; padding:14px; margin-top:20px; font-size:12px; color:var(--ink-soft); line-height:1.6; }
  .summary-note svg{ width:18px; height:18px; stroke:#25D366; flex-shrink:0; margin-top:1px; }

  .empty-cart{ text-align:center; padding:100px 20px; }
  .empty-cart h2{ font-size:26px; margin-bottom:12px; }
  .empty-cart p{ color:var(--ink-soft); margin-bottom:28px; }
  .empty-cart .btn{ width:auto; display:inline-flex; }

  footer{ background:#150F0A; color:#c7c0aa; padding:50px 0 26px; text-align:center; font-size:12px; }
  footer a{ color:var(--gold); }

  @media (max-width:900px){
    .checkout-layout{ grid-template-columns:1fr; }
    .summary-card{ position:static; }
  }
  @media (max-width:560px){
    .wrap{ padding:0 20px; }
    .field-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<script src="products-data.js"></script>
<script src="cart.js"></script>

<header>
  <div class="wrap nav-row">
    <a href="index.html" class="logo" aria-label="Zany'sCollection home">
      <img src="images/zany-emblem-transparent.png" alt="" style="width:34px;height:auto;display:block;">
      <span class="logo-text">Zany's<span>Collection</span></span>
    </a>
    <div class="icons-row">
      <a href="cart.html" class="cart-dot" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4.7 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg></a>
    </div>
  </div>
</header>

<div class="wrap page-head">
  <div class="breadcrumb"><a href="index.html">Home</a><span>/</span><a href="cart.html">Cart</a><span>/</span><span>Checkout</span></div>
  <h1>Checkout</h1>
</div>

<div id="checkoutRoot"></div>

<footer>
  <div class="wrap">© 2026 Zany'sCollection · <a href="index.html">Back to Home</a></div>
</footer>

<script>
  // The store owner's WhatsApp number, in international format, digits only (no + or spaces).
  const STORE_WHATSAPP = '15165038326';

  function fmt(n){ return '$' + n.toLocaleString('en-US'); }

  const root = document.getElementById('checkoutRoot');
  const items = getCartDetailed();

  if(items.length === 0){
    root.innerHTML = `
      <div class="wrap empty-cart">
        <h2>Your cart is empty</h2>
        <p>Add something to your cart before checking out.</p>
        <a href="shop.html" class="btn btn-dark">Start Shopping</a>
      </div>`;
  } else {
    const subtotal = items.reduce((s,i) => s + i.price * i.qty, 0);

    root.innerHTML = `
      <div class="wrap checkout-layout">
        <form class="form-card" id="checkoutForm" novalidate>
          <h3>Your Details</h3>
          <div class="field-row">
            <div class="field" id="field-name">
              <label for="fullName">Full Name *</label>
              <input type="text" id="fullName" name="fullName">
              <div class="field-error-msg">Please enter your name.</div>
            </div>
            <div class="field" id="field-phone">
              <label for="phone">Phone Number *</label>
              <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8900">
              <div class="field-error-msg">Please enter a phone number.</div>
            </div>
          </div>
          <div class="field" id="field-email">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
          </div>
          <div class="field" id="field-address">
            <label for="address">Shipping Address *</label>
            <textarea id="address" name="address" placeholder="Street address, city, state/province, postal code, country"></textarea>
            <div class="field-error-msg">Please enter your shipping address.</div>
          </div>
          <div class="field">
            <label for="notes">Order Notes (optional)</label>
            <textarea id="notes" name="notes" placeholder="Gift wrapping, delivery instructions, etc."></textarea>
          </div>
        </form>

        <div class="summary-card">
          <h3>Order Summary</h3>
          ${items.map(item => `
            <div class="summary-item">
              <span>${item.name}${item.size ? ' (Size ' + item.size + ')' : ''} × ${item.qty}</span>
              <span>${fmt(item.price * item.qty)}</span>
            </div>`).join('')}
          <div class="summary-row total"><span>Total</span><span>${fmt(subtotal)}</span></div>

          <div class="summary-note">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5.1-1.3A10 10 0 1012 2z"/></svg>
            <span>Tapping "Place Order" opens WhatsApp with your order pre-filled. Nothing is charged automatically — we'll confirm payment and delivery with you directly in chat.</span>
          </div>

          <div style="margin-top:16px;">
            <button type="submit" form="checkoutForm" class="btn btn-whatsapp" id="placeOrderBtn">
              <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5.1-1.3A10 10 0 1012 2zm5.8 14.2c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-3.4-.9-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.3 0 .5-.1.2-.2.3-.3.5-.2.2-.3.3-.1.6.2.3.9 1.5 1.9 2.4 1.3 1.2 2.4 1.5 2.7 1.7.3.2.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.8.3.1.5.2.5.3.1.2.1.6-.1 1.1z"/></svg>
              Place Order via WhatsApp
            </button>
          </div>
        </div>
      </div>`;

    document.getElementById('checkoutForm').addEventListener('submit', function(e){
      e.preventDefault();

      // ---- Validate required fields ----
      const nameVal = document.getElementById('fullName').value.trim();
      const phoneVal = document.getElementById('phone').value.trim();
      const addressVal = document.getElementById('address').value.trim();
      let valid = true;

      [['field-name', nameVal], ['field-phone', phoneVal], ['field-address', addressVal]].forEach(([id, val]) => {
        const field = document.getElementById(id);
        if(!val){ field.classList.add('error'); valid = false; }
        else { field.classList.remove('error'); }
      });
      if(!valid) return;

      const emailVal = document.getElementById('email').value.trim();
      const notesVal = document.getElementById('notes').value.trim();

      // ---- Build the order message ----
      let msg = `Hi! I'd like to place an order from Zany'sCollection:\n\n`;
      items.forEach(item => {
        msg += `• ${item.name}${item.size ? ' (Size ' + item.size + ')' : ''} × ${item.qty} — ${fmt(item.price * item.qty)}\n`;
      });
      msg += `\nTotal: ${fmt(subtotal)}\n\n`;
      msg += `Name: ${nameVal}\nPhone: ${phoneVal}\n`;
      if(emailVal) msg += `Email: ${emailVal}\n`;
      msg += `Shipping Address: ${addressVal}\n`;
      if(notesVal) msg += `Notes: ${notesVal}\n`;

      const waUrl = `https://wa.me/${STORE_WHATSAPP}?text=${encodeURIComponent(msg)}`;

      clearCart();
      window.location.href = waUrl;
    });
  }
</script>
</body>
</html>
