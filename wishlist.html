<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wishlist — Zany'sCollection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald:#0B3D2E; --emerald-deep:#082B20; --emerald-light:#1D5C46;
    --magenta:#C2185B; --magenta-deep:#9A1149;
    --gold:#D4AF37; --gold-deep:#B8912A;
    --cream:#FBF6EA; --ink:#20180F; --ink-soft:#5c5548; --line:#EAE0C8;
    --display:'Playfair Display', serif; --body:'Poppins', sans-serif; --max:1280px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:var(--body); color:var(--ink); background:var(--cream); -webkit-font-smoothing:antialiased; }
  img,svg{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  :focus-visible{ outline:2px solid var(--magenta); outline-offset:3px; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 40px; }
  .eyebrow{ font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-deep); font-weight:700; }
  h1,h2{ font-family:var(--display); font-weight:700; line-height:1.1; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:12px 22px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; border-radius:40px; transition:all .3s ease; }
  .btn-dark{ background:var(--emerald); color:#fff; }
  .btn-dark:hover{ background:var(--magenta); }

  header{ position:sticky; top:0; z-index:100; background:rgba(251,246,234,.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; height:88px; }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-text{
    font-family:var(--display); font-size:19px; font-weight:800;
    text-transform:uppercase; letter-spacing:.1em;
    background:linear-gradient(100deg, #9B5F5F 15%, #F3D9C4 42%, #C9967C 58%, #9B5F5F 85%);
    background-size:280% 100%; background-position:20% 0;
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo-text span{ -webkit-background-clip:text; background-clip:text; color:transparent; }
  nav.primary ul{ display:flex; gap:40px; }
  nav.primary a{ font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; }
  .icons-row{ display:flex; align-items:center; gap:22px; }
  .menu-toggle{ display:none; width:38px; height:38px; align-items:center; justify-content:center; }
  .menu-toggle svg{ width:22px; height:22px; stroke:var(--emerald); }
  .mobile-nav{ display:none; position:absolute; top:100%; left:0; right:0; background:var(--cream); border-bottom:1px solid var(--line); box-shadow:0 16px 28px -14px rgba(0,0,0,.22); z-index:99; }
  .mobile-nav.open{ display:block; }
  .mobile-nav ul{ display:flex; flex-direction:column; padding:6px 24px 18px; }
  .mobile-nav li{ border-bottom:1px solid var(--line); }
  .mobile-nav li:last-child{ border-bottom:none; }
  .mobile-nav a{ display:block; padding:15px 2px; font-size:13.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--ink); }
  .mobile-nav a:hover{ color:var(--magenta-deep); }
  .icons-row svg{ width:19px; height:19px; stroke:var(--emerald); }
  .cart-dot{ position:relative; }
  .wishlist-dot{ position:relative; }
  .wishlist-dot::after{ content:attr(data-count); position:absolute; top:-7px; right:-8px; background:var(--magenta); color:#fff; font-size:9px; width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .wishlist-dot:not([data-count])::after, .wishlist-dot[data-count="0"]::after{ display:none; }
  .wishlist-dot.active svg{ fill:var(--magenta); stroke:var(--magenta); }
  .cart-dot::after{ content:attr(data-count); position:absolute; top:-7px; right:-8px; background:var(--magenta); color:#fff; font-size:9px; width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .cart-dot:not([data-count])::after, .cart-dot[data-count="0"]::after{ display:none; }

  .page-head{ padding:36px 0 10px; }
  .breadcrumb{ font-size:12px; color:var(--ink-soft); display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .page-head h1{ font-size:clamp(28px,3.4vw,38px); }
  .page-head .count{ font-size:13px; color:var(--ink-soft); margin-top:8px; }

  .wish-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; padding:30px 0 90px; }
  .wish-card{ background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 18px -10px rgba(32,24,15,.12); transition:transform .3s ease, box-shadow .3s ease; }
  .wish-card:hover{ transform:translateY(-4px); box-shadow:0 20px 34px -14px rgba(32,24,15,.2); }
  .wish-media{ position:relative; aspect-ratio:3/4; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .wish-media.jewelry{ background:linear-gradient(150deg,#0B3D2E,#1D5C46); }
  .wish-media.suits{ background:linear-gradient(150deg,#9A1149,#C2185B); }
  .wish-media.bags{ background:linear-gradient(150deg,#7a5c14,#D4AF37); }
  .wish-media img{ width:100%; height:100%; object-fit:cover; }
  .wish-media svg{ width:44px; height:44px; stroke:#fff; opacity:.85; }
  .wish-remove{ position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; }
  .wish-remove svg{ width:15px; height:15px; stroke:var(--emerald); }
  .wish-remove:hover svg{ stroke:var(--magenta-deep); }
  .wish-info{ padding:16px 16px 18px; }
  .wish-info .eyebrow{ font-size:10px; }
  .wish-info h4{ font-family:var(--display); font-size:16px; font-weight:700; margin:5px 0 8px; }
  .wish-info h4 a:hover{ color:var(--magenta-deep); }
  .wish-price{ font-weight:700; color:var(--magenta-deep); font-size:14px; margin-bottom:12px; }
  .wish-info .btn{ width:100%; }

  .empty-wish{ text-align:center; padding:100px 20px; }
  .empty-wish svg{ width:64px; height:64px; stroke:var(--gold-deep); margin:0 auto 20px; }
  .empty-wish h2{ font-size:26px; margin-bottom:12px; }
  .empty-wish p{ color:var(--ink-soft); margin-bottom:28px; }
  .empty-wish .btn{ width:auto; display:inline-flex; padding:16px 30px; font-size:13px; }

  footer{ background:#150F0A; color:#c7c0aa; padding:50px 0 26px; text-align:center; font-size:12px; }
  footer a{ color:var(--gold); }

  @media (max-width:1024px){
    .wish-grid{ grid-template-columns:repeat(3,1fr); }
    nav.primary{ display:none; }
    .menu-toggle{ display:flex; }
  }
  @media (max-width:640px){
    .wrap{ padding:0 20px; }
    .wish-grid{ grid-template-columns:1fr 1fr; gap:14px; }
  }
</style>
</head>
<body>
<script src="products-data.js"></script>
<script src="cart.js"></script>

<header>
  <div class="wrap nav-row">
    <a href="index.html" class="logo" aria-label="Zany'sCollection home">
      <img src="images/zany-emblem-transparent.png" alt="" style="width:34px;height:auto;display:block;">
      <span class="logo-text">Zany's<span>Collection</span></span>
    </a>
    <nav class="primary" aria-label="Primary">
      <ul><li><a href="shop.html">Shop All</a></li></ul>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="icons-row">
      <a href="wishlist.html" class="wishlist-dot active" aria-label="Wishlist"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4c2.1-.3 4 .7 5.4 2.6C12.4 4.7 14.3 3.7 16.4 4 20 4.5 21.6 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg></a>
      <a href="cart.html" class="cart-dot" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4.7 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg></a>
    </div>
  </div>
  <div class="mobile-nav" id="mobileNav">
    <ul><li><a href="shop.html">Shop All</a></li></ul>
  </div>
</header>

<div class="wrap page-head">
  <div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Wishlist</span></div>
  <h1>Your Wishlist</h1>
  <p class="count" id="wishCount"></p>
</div>

<div id="wishRoot"></div>

<footer>
  <div class="wrap">© 2026 Zany'sCollection · <a href="index.html">Back to Home</a></div>
</footer>

<script>
  const menuToggle = document.getElementById('menuToggle');
  const mobileNav = document.getElementById('mobileNav');
  if(menuToggle && mobileNav){
    menuToggle.addEventListener('click', () => {
      const isOpen = mobileNav.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    mobileNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      mobileNav.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }));
  }

  const icons = {
    jewelry:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.2"><path d="M12 2L4 9l8 13 8-13-8-7z"/><path d="M4 9h16"/></svg>`,
    suits:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.2"><path d="M6 8c0-3 2.5-5.5 6-5.5S18 5 18 8"/><rect x="4" y="8" width="16" height="13" rx="1.5"/></svg>`,
    bags:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.2"><path d="M8 7V5a4 4 0 018 0v2"/><rect x="3" y="7" width="18" height="14" rx="2"/></svg>`
  };
  const catLabels2 = { jewelry:'Jewelry', suits:'Pakistani Suits', bags:'Handbags' };
  function fmt(n){ return '$' + n.toLocaleString('en-US'); }

  function mediaHTML(item){
    const src = item.images ? item.images[0] : item.img;
    return src ? `<img src="${src}" alt="${item.name}">` : icons[item.cat];
  }

  function renderWishlist(){
    const root = document.getElementById('wishRoot');
    const items = getWishlistDetailed();
    document.getElementById('wishCount').textContent = items.length ? `${items.length} item${items.length!==1?'s':''}` : '';

    if(items.length === 0){
      root.innerHTML = `
        <div class="wrap empty-wish">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4c2.1-.3 4 .7 5.4 2.6C12.4 4.7 14.3 3.7 16.4 4 20 4.5 21.6 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg>
          <h2>Your wishlist is empty</h2>
          <p>Tap the heart icon on any product to save it here for later.</p>
          <a href="shop.html" class="btn btn-dark">Start Shopping</a>
        </div>`;
      return;
    }

    root.innerHTML = `
      <div class="wrap wish-grid">
        ${items.map(item => `
          <div class="wish-card" data-id="${item.id}">
            <div class="wish-media ${item.cat}">
              <a href="product.html?id=${item.id}" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">${mediaHTML(item)}</a>
              <button class="wish-remove" aria-label="Remove from wishlist"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 4l16 16M20 4L4 20"/></svg></button>
            </div>
            <div class="wish-info">
              <span class="eyebrow">${catLabels2[item.cat]}</span>
              <h4><a href="product.html?id=${item.id}">${item.name}</a></h4>
              <div class="wish-price">${fmt(item.price)}</div>
              <button class="btn btn-dark add-to-cart-btn">Add to Cart</button>
            </div>
          </div>`).join('')}
      </div>`;

    root.querySelectorAll('.wish-card').forEach(card => {
      const id = Number(card.dataset.id);
      card.querySelector('.wish-remove').onclick = () => {
        toggleWishlist(id);
        renderWishlist();
      };
      card.querySelector('.add-to-cart-btn').onclick = (e) => {
        addToCart(id, 1, null);
        const btn = e.currentTarget;
        const original = btn.textContent;
        btn.textContent = 'Added ✓';
        setTimeout(() => { btn.textContent = original; }, 1400);
      };
    });
  }

  renderWishlist();
</script>
</body>
</html>
