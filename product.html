<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Zany'sCollection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald:#0B3D2E; --emerald-deep:#082B20; --emerald-light:#1D5C46;
    --magenta:#C2185B; --magenta-deep:#9A1149;
    --gold:#D4AF37; --gold-deep:#B8912A;
    --cream:#FBF6EA; --ink:#20180F; --ink-soft:#5c5548; --line:#EAE0C8;
    --display:'Playfair Display', serif; --body:'Poppins', sans-serif; --max:1280px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:var(--body); color:var(--ink); background:var(--cream); -webkit-font-smoothing:antialiased; }
  img,svg{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button,select,input{font-family:inherit;}
  button{cursor:pointer; border:none; background:none;}
  :focus-visible{ outline:2px solid var(--magenta); outline-offset:3px; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 40px; }
  .eyebrow{ font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-deep); font-weight:700; }
  h1,h2,h3{ font-family:var(--display); font-weight:700; line-height:1.1; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:16px 30px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; border-radius:40px; transition:all .3s ease; }
  .btn-dark{ background:var(--emerald); color:#fff; }
  .btn-dark:hover{ background:var(--magenta); }
  .btn-dark:disabled{ background:#c9c2a9; cursor:not-allowed; }

  header{ position:sticky; top:0; z-index:100; background:rgba(251,246,234,.9); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; height:88px; }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-text{
    font-family:var(--display); font-size:19px; font-weight:800;
    text-transform:uppercase; letter-spacing:.1em;
    background:linear-gradient(100deg, #9B5F5F 15%, #F3D9C4 42%, #C9967C 58%, #9B5F5F 85%);
    background-size:280% 100%; background-position:20% 0;
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo-text span{ -webkit-background-clip:text; background-clip:text; color:transparent; }
  nav.primary ul{ display:flex; gap:40px; }
  nav.primary a{ font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; position:relative; padding-bottom:4px; }
  nav.primary a::after{ content:''; position:absolute; left:0; bottom:0; width:0; height:2px; background:var(--magenta); border-radius:2px; transition:width .3s ease; }
  nav.primary a:hover::after{ width:100%; }
  .icons-row{ display:flex; align-items:center; gap:22px; }
  .menu-toggle{ display:none; width:38px; height:38px; align-items:center; justify-content:center; }
  .menu-toggle svg{ width:22px; height:22px; stroke:var(--emerald); }
  .mobile-nav{ display:none; position:absolute; top:100%; left:0; right:0; background:var(--cream); border-bottom:1px solid var(--line); box-shadow:0 16px 28px -14px rgba(0,0,0,.22); z-index:99; }
  .mobile-nav.open{ display:block; }
  .mobile-nav ul{ display:flex; flex-direction:column; padding:6px 24px 18px; }
  .mobile-nav li{ border-bottom:1px solid var(--line); }
  .mobile-nav li:last-child{ border-bottom:none; }
  .mobile-nav a{ display:block; padding:15px 2px; font-size:13.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--ink); }
  .mobile-nav a:hover{ color:var(--magenta-deep); }
  .icons-row svg{ width:19px; height:19px; stroke:var(--emerald); }
  .cart-dot{ position:relative; }
  .wishlist-dot{ position:relative; }
  .wishlist-dot::after{ content:attr(data-count); position:absolute; top:-7px; right:-8px; background:var(--magenta); color:#fff; font-size:9px; width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .wishlist-dot:not([data-count])::after, .wishlist-dot[data-count="0"]::after{ display:none; }
  .wishlist-dot.active svg{ fill:var(--magenta); stroke:var(--magenta); }
  .cart-dot::after{ content:attr(data-count); position:absolute; top:-7px; right:-8px; background:var(--magenta); color:#fff; font-size:9px; width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .cart-dot:not([data-count]), .cart-dot[data-count="0"]{ }
  .cart-dot:not([data-count])::after, .cart-dot[data-count="0"]::after{ display:none; }

  .page-head{ padding:28px 0; }
  .breadcrumb{ font-size:12px; color:var(--ink-soft); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .breadcrumb a:hover{ color:var(--magenta-deep); }

  .pdp-layout{ display:grid; grid-template-columns:1fr 1fr; gap:60px; padding:10px 0 90px; align-items:start; }

  /* Gallery */
  .gallery-main{ position:relative; aspect-ratio:1/1; border-radius:20px; overflow:hidden; background:linear-gradient(150deg,#0B3D2E,#1D5C46); display:flex; align-items:center; justify-content:center; }
  .gallery-main.suits{ background:linear-gradient(150deg,#9A1149,#C2185B); }
  .gallery-main.bags{ background:linear-gradient(150deg,#7a5c14,#D4AF37); }
  .gallery-main img{ width:100%; height:100%; object-fit:cover; }
  .gallery-main svg{ width:90px; height:90px; stroke:#fff; opacity:.85; }
  .gallery-main .badge{ position:absolute; top:20px; left:20px; background:var(--gold); color:var(--emerald-deep); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:6px 14px; border-radius:20px; font-weight:800; }
  .thumbs{ display:flex; gap:12px; margin-top:14px; }
  .thumb{ width:74px; height:74px; border-radius:10px; overflow:hidden; cursor:pointer; border:2px solid transparent; opacity:.65; transition:all .2s; background-size:cover; background-position:center; }
  .thumb.active{ border-color:var(--gold-deep); opacity:1; }
  .thumb:hover{ opacity:1; }
  .thumb img{ width:100%; height:100%; object-fit:cover; }

  /* Info panel */
  .pdp-info .eyebrow{ margin-bottom:10px; }
  .pdp-info h1{ font-size:clamp(30px,3.4vw,42px); margin-bottom:14px; }
  .rating-row{ display:flex; align-items:center; gap:8px; margin-bottom:20px; }
  .stars{ display:flex; gap:2px; }
  .stars svg{ width:15px; height:15px; fill:var(--gold); }
  .rating-row span{ font-size:13px; color:var(--ink-soft); }
  .price-row{ display:flex; align-items:baseline; gap:12px; margin-bottom:24px; }
  .price{ font-family:var(--display); font-size:32px; font-weight:700; color:var(--magenta-deep); }
  .price-was{ font-size:17px; color:#a8a196; text-decoration:line-through; }
  .save-badge{ background:var(--magenta); color:#fff; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .desc{ font-size:14.5px; line-height:1.85; color:var(--ink-soft); margin-bottom:30px; max-width:480px; }

  .option-block{ margin-bottom:26px; }
  .option-block h4{ font-family:var(--display); font-size:14px; font-weight:700; margin-bottom:12px; }
  .size-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .size-pill{ min-width:46px; padding:10px 14px; border-radius:30px; background:#fff; box-shadow:0 2px 8px -6px rgba(32,24,15,.2); font-size:13px; font-weight:600; text-align:center; transition:all .2s; }
  .size-pill.active{ background:var(--emerald); color:#fff; }
  .size-pill:hover:not(.active){ background:var(--gold); color:var(--emerald-deep); }

  .qty-row{ display:flex; align-items:center; gap:16px; margin-bottom:28px; }
  .qty-stepper{ display:flex; align-items:center; background:#fff; border-radius:30px; box-shadow:0 2px 8px -6px rgba(32,24,15,.2); }
  .qty-stepper button{ width:42px; height:42px; font-size:18px; font-weight:700; color:var(--emerald); }
  .qty-stepper span{ width:34px; text-align:center; font-weight:700; }
  .stock-note{ font-size:12.5px; color:var(--ink-soft); }
  .stock-note.out{ color:var(--magenta-deep); font-weight:600; }

  .action-row{ display:flex; gap:14px; margin-bottom:36px; }
  .action-row .btn{ flex:1; }
  .wish-toggle{ width:56px; height:56px; border-radius:50%; background:#fff; box-shadow:0 2px 8px -6px rgba(32,24,15,.2); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; }
  .wish-toggle svg{ width:20px; height:20px; stroke:var(--emerald); transition:all .2s; }
  .wish-toggle.active svg{ fill:var(--magenta); stroke:var(--magenta); }

  .trust-mini{ display:flex; gap:22px; flex-wrap:wrap; padding-top:24px; border-top:1px solid var(--line); }
  .trust-mini div{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft); }
  .trust-mini svg{ width:17px; height:17px; stroke:var(--gold-deep); flex-shrink:0; }

  .toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--emerald); color:#fff; padding:14px 26px; border-radius:30px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all .35s ease; z-index:300; box-shadow:0 12px 24px -8px rgba(0,0,0,.3); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Related products */
  .related{ padding:70px 0 90px; }
  .related h2{ font-size:clamp(26px,3vw,34px); text-align:center; margin-bottom:44px; }
  .rel-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
  .rel-card{ background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 18px -10px rgba(32,24,15,.12); transition:transform .3s ease, box-shadow .3s ease; }
  .rel-card:hover{ transform:translateY(-4px); box-shadow:0 20px 34px -14px rgba(32,24,15,.2); }
  .rel-media{ aspect-ratio:3/4; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .rel-media.jewelry{ background:linear-gradient(150deg,#0B3D2E,#1D5C46); }
  .rel-media.suits{ background:linear-gradient(150deg,#9A1149,#C2185B); }
  .rel-media.bags{ background:linear-gradient(150deg,#7a5c14,#D4AF37); }
  .rel-media img{ width:100%; height:100%; object-fit:cover; }
  .rel-media svg{ width:40px; height:40px; stroke:#fff; opacity:.85; }
  .rel-info{ padding:14px 16px 18px; }
  .rel-info h5{ font-family:var(--display); font-size:15px; font-weight:700; margin-bottom:6px; }
  .rel-info .price{ font-size:14px; }

  .not-found{ text-align:center; padding:100px 20px; }
  .not-found h1{ font-size:32px; margin-bottom:14px; }
  .not-found p{ color:var(--ink-soft); margin-bottom:26px; }

  footer{ background:#150F0A; color:#c7c0aa; padding:50px 0 26px; text-align:center; font-size:12px; }
  footer a{ color:var(--gold); }

  @media (max-width:900px){
    .pdp-layout{ grid-template-columns:1fr; gap:34px; }
    .rel-grid{ grid-template-columns:repeat(2,1fr); }
    nav.primary{ display:none; }
    .menu-toggle{ display:flex; }
  }
  @media (max-width:640px){
    .wrap{ padding:0 20px; }
    .action-row{ flex-direction:column; }
    .wish-toggle{ align-self:flex-start; }
  }
</style>
</head>
<body>
<script src="products-data.js"></script>
<script src="cart.js"></script>

<header>
  <div class="wrap nav-row">
    <a href="index.html" class="logo" aria-label="Zany'sCollection home">
      <img src="images/zany-emblem-transparent.png" alt="" style="width:34px;height:auto;display:block;">
      <span class="logo-text">Zany's<span>Collection</span></span>
    </a>
    <nav class="primary" aria-label="Primary">
      <ul>
        <li><a href="shop.html">Shop All</a></li>
        <li><a href="index.html#story">Our Story</a></li>
      </ul>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="icons-row">
      <a href="wishlist.html" class="wishlist-dot" aria-label="Wishlist"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4c2.1-.3 4 .7 5.4 2.6C12.4 4.7 14.3 3.7 16.4 4 20 4.5 21.6 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg></a>
      <a href="cart.html" class="cart-dot" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4.7 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg></a>
    </div>
  </div>
  <div class="mobile-nav" id="mobileNav">
    <ul>
      <li><a href="shop.html">Shop All</a></li>
      <li><a href="index.html#story">Our Story</a></li>
    </ul>
  </div>
</header>

<div id="pdpRoot"></div>

<footer>
  <div class="wrap">© 2026 Zany'sCollection · <a href="index.html">Back to Home</a></div>
</footer>

<div class="toast" id="toast">Added to cart</div>

<script>
  const menuToggle = document.getElementById('menuToggle');
  const mobileNav = document.getElementById('mobileNav');
  if(menuToggle && mobileNav){
    menuToggle.addEventListener('click', () => {
      const isOpen = mobileNav.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    mobileNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      mobileNav.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }));
  }

  const starSVG = `<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6L22 9.6l-5 5 1.3 7.1L12 18l-6.3 3.7L7 14.6l-5-5 7.1-1z"/></svg>`;
  const icons = {
    jewelry:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.2"><path d="M12 2L4 9l8 13 8-13-8-7z"/><path d="M4 9h16"/></svg>`,
    suits:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.2"><path d="M6 8c0-3 2.5-5.5 6-5.5S18 5 18 8"/><rect x="4" y="8" width="16" height="13" rx="1.5"/></svg>`,
    bags:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.2"><path d="M8 7V5a4 4 0 018 0v2"/><rect x="3" y="7" width="18" height="14" rx="2"/></svg>`
  };
  const catLabelsFull = { jewelry:'Jewelry', suits:'Pakistani Suits', bags:'Handbags' };
  function fmt(n){ return '$' + n.toLocaleString('en-US'); }

  const params = new URLSearchParams(window.location.search);
  const id = Number(params.get('id'));
  const product = catalog.find(p => p.id === id);
  const root = document.getElementById('pdpRoot');

  if(!product){
    root.innerHTML = `
      <div class="wrap not-found">
        <h1>Product not found</h1>
        <p>This item may have been removed, or the link is incorrect.</p>
        <a href="shop.html" class="btn btn-dark">Back to Shop</a>
      </div>`;
  } else {
    const gallery = product.images ? product.images : (product.img ? [product.img] : []);
    let qty = 1;
    let selectedSize = product.sizes ? product.sizes[Math.floor(product.sizes.length/2)] : null;
    let wished = isInWishlist(product.id);

    function mediaHTML(src){
      return src ? `<img src="${src}" alt="${product.name}">` : icons[product.cat];
    }

    root.innerHTML = `
      <div class="wrap page-head">
        <div class="breadcrumb">
          <a href="index.html">Home</a><span>/</span>
          <a href="shop.html">Shop</a><span>/</span>
          <span>${catLabelsFull[product.cat]}</span><span>/</span>
          <span>${product.name}</span>
        </div>
      </div>
      <div class="wrap pdp-layout">
        <div class="pdp-gallery">
          <div class="gallery-main ${product.cat}" id="galleryMain">
            ${product.badge ? `<span class="badge">${product.badge}</span>` : ''}
            ${mediaHTML(gallery[0])}
          </div>
          ${gallery.length > 1 ? `
          <div class="thumbs" id="thumbRow">
            ${gallery.map((src,i) => `<div class="thumb ${i===0?'active':''}" data-i="${i}"><img src="${src}" alt="${product.name} view ${i+1}"></div>`).join('')}
          </div>` : ''}
        </div>

        <div class="pdp-info">
          <span class="eyebrow">${catLabelsFull[product.cat]}</span>
          <h1>${product.name}</h1>
          <div class="rating-row">
            <div class="stars">${starSVG.repeat(5)}</div>
            <span>${product.rating} · ${product.reviews} reviews</span>
          </div>
          <div class="price-row">
            <span class="price">${fmt(product.price)}</span>
            ${product.was ? `<span class="price-was">${fmt(product.was)}</span><span class="save-badge">Save ${Math.round((1-product.price/product.was)*100)}%</span>` : ''}
          </div>
          <p class="desc">${product.desc || ''}</p>

          ${product.sizes ? `
          <div class="option-block">
            <h4>Select Size</h4>
            <div class="size-row" id="sizeRow">
              ${product.sizes.map(s => `<div class="size-pill ${s===selectedSize?'active':''}" data-size="${s}">${s}</div>`).join('')}
            </div>
          </div>` : ''}

          <div class="option-block">
            <h4>Quantity</h4>
            <div class="qty-row">
              <div class="qty-stepper">
                <button id="qtyMinus" aria-label="Decrease quantity">−</button>
                <span id="qtyVal">1</span>
                <button id="qtyPlus" aria-label="Increase quantity">+</button>
              </div>
              <span class="stock-note ${product.stock ? '' : 'out'}">${product.stock ? 'In stock, ships in 2–4 days' : 'Currently out of stock'}</span>
            </div>
          </div>

          <div class="action-row">
            <button class="btn btn-dark" id="addToCartBtn" ${product.stock ? '' : 'disabled'}>${product.stock ? 'Add to Cart' : 'Out of Stock'}</button>
            <button class="wish-toggle ${wished ? 'active' : ''}" id="wishToggle" aria-label="Add to wishlist">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4c2.1-.3 4 .7 5.4 2.6C12.4 4.7 14.3 3.7 16.4 4 20 4.5 21.6 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg>
            </button>
          </div>

          <div class="trust-mini">
            <div><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M12 2l3 6 6 1-4.5 4.4 1 6.1L12 16.5l-5.5 3 1-6.1L3 9l6-1 3-6z"/></svg> Certified Authentic</div>
            <div><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M3 12h13l-4-4m4 4l-4 4"/><path d="M16 5h5v14h-5"/></svg> USA &amp; Canada Shipping</div>
            <div><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M4 4v6h6"/><path d="M4.5 15a8 8 0 1 0 2-9.4L4 10"/></svg> Questions? Message Us</div>
          </div>
        </div>
      </div>
    `;

    // ---- Gallery thumbnail switching ----
    if(gallery.length > 1){
      document.querySelectorAll('.thumb').forEach(t => {
        t.addEventListener('click', () => {
          document.querySelectorAll('.thumb').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          const i = Number(t.dataset.i);
          const main = document.getElementById('galleryMain');
          const badge = main.querySelector('.badge');
          main.innerHTML = (badge ? badge.outerHTML : '') + mediaHTML(gallery[i]);
        });
      });
    }

    // ---- Size selector ----
    const sizeRow = document.getElementById('sizeRow');
    if(sizeRow){
      sizeRow.addEventListener('click', (e) => {
        const pill = e.target.closest('.size-pill');
        if(!pill) return;
        sizeRow.querySelectorAll('.size-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        selectedSize = pill.dataset.size;
      });
    }

    // ---- Quantity stepper ----
    document.getElementById('qtyPlus').addEventListener('click', () => {
      qty = Math.min(qty + 1, 10);
      document.getElementById('qtyVal').textContent = qty;
    });
    document.getElementById('qtyMinus').addEventListener('click', () => {
      qty = Math.max(qty - 1, 1);
      document.getElementById('qtyVal').textContent = qty;
    });

    // ---- Wishlist toggle ----
    document.getElementById('wishToggle').addEventListener('click', (e) => {
      wished = toggleWishlist(product.id);
      e.currentTarget.classList.toggle('active', wished);
    });

    // ---- Add to cart (real — saved via cart.js) ----
    const addBtn = document.getElementById('addToCartBtn');
    if(product.stock){
      addBtn.addEventListener('click', () => {
        addToCart(product.id, qty, selectedSize);
        const toast = document.getElementById('toast');
        toast.textContent = `Added ${qty} × ${product.name}${selectedSize ? ' (Size ' + selectedSize + ')' : ''} to cart`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2600);
      });
    }

    // ---- Related products (same category, exclude current) ----
    const related = catalog.filter(p => p.cat === product.cat && p.id !== product.id && (p.img || p.images)).slice(0, 4);
    if(related.length){
      const relSection = document.createElement('section');
      relSection.className = 'related';
      relSection.innerHTML = `
        <div class="wrap">
          <h2>You may also like</h2>
          <div class="rel-grid">
            ${related.map(p => `
              <a class="rel-card" href="product.html?id=${p.id}">
                <div class="rel-media ${p.cat}">${mediaHTML(p.images ? p.images[0] : p.img)}</div>
                <div class="rel-info">
                  <h5>${p.name}</h5>
                  <span class="price">${fmt(p.price)}</span>
                </div>
              </a>`).join('')}
          </div>
        </div>`;
      root.after(relSection);
    }

    document.title = `${product.name} — Zany'sCollection`;
  }
</script>
</body>
</html>
